<text x="20" y="232">☑</text><text x="40" y="232">audio</text><text x="80" y="232">Andy Weir</text><text x="325" y="232">The Martian</text><text x="470" y="232" font-family="Consolas,monospace" font-size="7.2" fill="#6B7684">Andy Weir/The Martian</text><text x="760" y="232">tags</text><text x="820" y="232">ready (dup)</text>
