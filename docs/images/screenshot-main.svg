<rect x="12" y="256" width="936" height="18" fill="#E9E9E9"/>
<text x="20" y="268" fill="#8A93A0">☐</text><text x="40" y="268" fill="#8A93A0">audio</text><text x="80" y="268" fill="#8A93A0">Andy Weir</text><text x="325" y="268" fill="#8A93A0">The Martian (mp3 rip)</text><text x="760" y="268" fill="#8A93A0">tags</text><text x="820" y="268" fill="#8A93A0">skipped</text>
