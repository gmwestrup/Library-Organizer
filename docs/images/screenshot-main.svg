<text x="20" y="286">☐</text><text x="40" y="286">audio</text><text x="80" y="286">Frank Herbert</text><text x="185" y="286">Dune</text><text x="300" y="286">01</text><text x="325" y="286">Dune</text><text x="470" y="286" font-family="Consolas,monospace" font-size="7.2" fill="#6B7684">Frank Herbert/Dune/Dune</text><text x="760" y="286">Audible</text><text x="820" y="286">ready</text>
</g>
